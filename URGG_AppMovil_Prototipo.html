let counts=JSON.parse(localStorage.getItem('urgg_counts')||'{}'), selected=null;
function save(){localStorage.setItem('urgg_counts',JSON.stringify(counts));renderAll();}
function searchProduct(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const arr=products.filter(p=>p.code.toLowerCase()===q||p.name.toLowerCase().includes(q)).slice(0,8);
 document.getElementById('results').innerHTML=arr.map(p=>'<div class="product"><b>'+p.code+'</b> · '+p.name+
 '<br><small>Pacto: '+p.pact+(p.location?' · '+p.location:'')+'</small>'+
 '<button class="secondary" onclick="selectProduct(\''+p.code+'\')">Seleccionar</button></div>').join('');
}
function selectProduct(code){selected=products.find(p=>p.code===code);document.getElementById('search').value=selected.code;document.getElementById('results').innerHTML='';renderSelected();}
function renderSelected(){
 if(!selected)return;
 const val=counts[selected.code];
 document.getElementById('selected').innerHTML='<b>'+selected.code+'</b><br><h3>'+selected.name+
 '</h3><small>Stock objetivo: '+selected.pact+(selected.location?' · '+selected.location:'')+
 '</small><br><label>Unidades encontradas:</label><input id="qty" type="number" min="0" value="'+(val?val.qty:'')+
 '" placeholder="Ej. 7"><button class="primary" onclick="saveCount()">GUARDAR RECUENTO</button>';
}
function saveCount(){const q=Math.max(0,parseInt(document.getElementById('qty').value||0));counts[selected.code]={qty:q,date:new Date().toLocaleString('es-ES')};save();renderSelected();}
function renderReorder(){
 const pending=products.filter(p=>counts[p.code]&&counts[p.code].qty<p.pact);
 document.getElementById('reorder').innerHTML=pending.length?
 pending.map(p=>'<div class="product"><b>'+p.name+'</b><br>Faltan <strong>'+ (p.pact-counts[p.code].qty)+'</strong> · '+p.code+'</div>').join(''):
 '🟢 No hay productos con recuento por debajo del pacto.';
}
function renderStats(){
 const checked=products.filter(p=>counts[p.code]).length;
 const missing=products.filter(p=>counts[p.code]&&counts[p.code].qty<p.pact).length;
 document.getElementById('stats').innerHTML='Revisados: <b>'+checked+' / '+products.length+'</b><br>Con reposición: <b>'+missing+'</b>';
}
function startScan(){
 const el=document.getElementById('reader');el.style.display='block';const scanner=new Html5Qrcode('reader');
 scanner.start({facingMode:'environment'},{fps:10,qrbox:220},text=>{
  scanner.stop().then(()=>{el.style.display='none';selectProduct(text.trim());});
 },()=>{}).catch(()=>alert('No se pudo abrir la cámara. Usa la búsqueda manual.'));
}
function resetDemo(){if(confirm('¿Borrar los recuentos guardados en este dispositivo?')){counts={};save();selected=null;document.getElementById('selected').innerHTML='<small>Selecciona o escanea un producto.</small>';}}
renderAll();
